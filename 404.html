<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonderland Samarinda</title>
<script>
/* GitHub Pages: /<slug> -> public.html?page=<slug> (link landing page berbasis "base URL + / + slug"). */
(function () {
  var base = location.pathname.replace(/[^\/]*$/, '');
  var parts = location.pathname.split('/').filter(Boolean);
  // Project site (user.github.io/repo/slug): segmen pertama adalah nama repo.
  var isProject = /\.github\.io$/.test(location.hostname);
  var slug = isProject ? parts[1] : parts[0];
  var root = isProject ? '/' + (parts[0] || '') + '/' : '/';
  if (slug) location.replace(root + 'public.html?page=' + encodeURIComponent(slug) + location.hash);
  else location.replace(root);
})();
</script></head><body>Mengalihkan…</body></html>
