<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonderland Samarinda</title>
<script>
/* GitHub Pages: /<slug> -> public.html?page=<slug>.
 * Nama file seperti index.html / public.html di URL diabaikan (mis. /repo/index.html/promo -> slug "promo"). */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var isProject = /\.github\.io$/.test(location.hostname);
  var root = isProject ? '/' + (parts[0] || '') + '/' : '/';
  var rest = isProject ? parts.slice(1) : parts;
  var slug = '';
  for (var i = 0; i < rest.length; i++) { if (!/\.html?$/i.test(rest[i])) { slug = rest[i]; break; } }
  if (slug) location.replace(root + 'public.html?page=' + encodeURIComponent(slug) + location.hash);
  else location.replace(root);
})();
</script></head><body>Mengalihkan…</body></html>
