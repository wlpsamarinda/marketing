<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" type="image/png" href="icons/favicon.png">
<script src="config.js"></script>
<script src="gas-shim.js"></script>
<title>Wonderland Samarinda</title>
<style>
:root{
  --primary:#6d28d9; --primary-dark:#4c1d95; --primary-light:#ede9fe;
  --accent:#f59e0b; --bg:#f4f5fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
  --border:#e5e7eb; --success:#10b981; --danger:#ef4444;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(76,29,149,.18);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
.hidden{display:none!important}
a{color:var(--primary)}
button{font-family:inherit;cursor:pointer}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(135deg,#2e1065 0%,#6d28d9 55%,#a855f7 100%);color:#fff;padding:0 0 46px}
.hero-inner{max-width:860px;margin:0 auto;padding:20px}
.hero-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.logo-badge{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;overflow:hidden;flex:none}
.logo-badge.has-img{width:48px;height:48px;background:#fff}
.logo-badge img{width:100%;height:100%;object-fit:contain;display:block}
.hero-brand b{font-size:15px;display:block;line-height:1.2}
.hero-brand small{font-size:11px;opacity:.8}
.hero h1{font-size:27px;line-height:1.25;font-weight:800;margin-bottom:10px}
.hero .desc{font-size:14.5px;opacity:.92;white-space:pre-wrap}
.hero-banner{margin-top:18px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-banner img{width:100%;display:block;max-height:320px;object-fit:cover}

/* ---------- OFFER ---------- */
.offer{max-width:860px;margin:-26px auto 0;padding:0 20px;position:relative;z-index:2}
.offer-box{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fcd34d;color:#78350f;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-lg);white-space:pre-wrap;font-size:14px}

/* ---------- FORM CARD ---------- */
.main{max-width:860px;margin:22px auto 40px;padding:0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.card h2{font-size:17px;margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ev-chip{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px}
.ev-chip .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ev-chip .v{font-size:13.5px;font-weight:700;margin-top:2px}
.kuota-bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:6px}
.kuota-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#a855f7)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
.form-control{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--text)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea.form-control{resize:vertical;min-height:80px}
.req{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:700;transition:all .15s ease;width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}

/* ---------- SUCCESS ---------- */
.success{max-width:560px;margin:40px auto;padding:0 20px;text-align:center}
.success .ic{width:74px;height:74px;border-radius:50%;background:#d1fae5;color:#059669;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 14px}
.success h1{font-size:22px;margin-bottom:8px}
.success p{color:var(--muted);font-size:14px}
.reg-box{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin:18px 0}
.reg-id{font-size:24px;font-weight:800;letter-spacing:1px;color:var(--primary-dark)}
.reg-box img{width:170px;height:170px;border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:10px}

/* ---------- STATES ---------- */
.state{max-width:460px;margin:70px auto;padding:0 20px;text-align:center}
.state .ic{font-size:46px;margin-bottom:12px}
.state h1{font-size:19px;margin-bottom:6px}
.state p{color:var(--muted);font-size:13.5px}
.spinner{width:34px;height:34px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toastRoot{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);max-width:320px}
.toast.error{background:var(--danger)}
@media(max-width:600px){.hero h1{font-size:22px}.card{padding:18px}}

.gen-sec{margin:20px 0 6px;padding-top:16px;border-top:1px dashed var(--border)}
.gen-sec h3{font-size:16px;margin-bottom:2px}
.gen-grp{margin-top:14px}
.gen-grp-t{font-size:12.5px;font-weight:800;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}
.gen-row.on{border-color:var(--primary);background:#faf8ff}
.gen-nm{min-width:0}
.gen-nm b{display:block;font-size:14px;line-height:1.3}
.gen-nm small{color:var(--muted);font-size:12.5px}
.gen-step{display:flex;align-items:center;gap:6px;flex:none}
.gen-step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:#f9fafb;font-size:19px;line-height:1;font-weight:700;color:var(--primary-dark)}
.gen-step button:active{background:var(--primary-light)}
.gen-step input{width:56px;text-align:center;padding:7px 4px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;-moz-appearance:textfield}
.gen-step input::-webkit-outer-spin-button,.gen-step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gen-sum{margin:16px 0 14px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #ddd6fe}
.gen-sum .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#4b5563;padding:2px 0}
.gen-sum .tot{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:800;margin-top:8px;padding-top:8px;border-top:1px dashed #c4b5fd}
.gen-sum .dp{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:700;color:var(--primary-dark);margin-top:4px}
.gen-sum .empty{font-size:13px;color:var(--muted);text-align:center}
.btn-wa{background:#25d366;color:#fff;text-decoration:none;margin-top:6px}
.btn-wa:hover{background:#1ebe5b}
.btn-ghost{background:#fff;color:var(--primary-dark);border-color:var(--border);margin-top:10px}
.soc{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);text-align:center}
.soc-t{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
.soc-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.soc-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.soc-btn:active{transform:scale(.97)}
.soc-instagram{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.soc-tiktok{background:#111}
.soc-facebook{background:#1877f2}
.soc-youtube{background:#e11d1d}
.soc-maps{background:#fff;color:#1f2430;border:1.5px solid #fbbf24}
.soc-maps b{color:#b45309}
</style>
</head>
<body>
<div id="toastRoot"></div>
<div id="app"><div class="state"><div class="spinner"></div><p>Memuat halaman...</p></div></div>

<script>
'use strict';

/* ---------- Helpers ---------- */
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg, type){ type=type||'success'; const r=document.getElementById('toastRoot'); const el=document.createElement('div'); el.className='toast '+(type==='error'?'error':''); el.textContent=msg; r.appendChild(el); setTimeout(function(){ el.remove(); },3600); }
function qs(name){ const m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : ''; }

const SLUG = (qs('page') || qs('slug') || '').trim();
const UTM = { source: qs('utm_source'), medium: qs('utm_medium'), campaign: qs('utm_campaign'), term: qs('utm_term'), content: qs('utm_content') };

/* Definisi kolom form yang diizinkan (whitelist) */
const FIELD_DEFS = {
  nama:            { label: 'Nama Lengkap', req: true, ph: 'Nama Anda' },
  whatsapp:        { label: 'No. WhatsApp', req: true, ph: '08xxxxxxxxxx' },
  email:           { label: 'Email', type: 'email', ph: 'email@contoh.com' },
  kota:            { label: 'Kota / Domisili', ph: 'mis. Samarinda' },
  jenis_pelanggan: { label: 'Jenis (Individu / Keluarga / Sekolah / Kantor / Komunitas)', ph: 'mis. Keluarga' },
  minat:           { label: 'Minat / Kebutuhan', textarea: true, ph: 'Ceritakan kebutuhan Anda...' },
  jumlah_peserta:  { label: 'Jumlah Peserta', type: 'number', ph: 'mis. 25' },
  tanggal_rencana: { label: 'Tanggal Rencana Kunjungan', type: 'date' },
  tanggal_kunjungan:{ label: 'Tanggal Kunjungan', type: 'date' },
  paket:           { label: 'Paket / Permintaan Khusus', ph: 'mis. Paket Sekolah' },
  umur:            { label: 'Umur', type: 'number', ph: 'mis. 10' },
  sekolah:         { label: 'Sekolah / Instansi', ph: 'mis. SDN 001' },
  tanggal_lahir:   { label: 'Tanggal Lahir', type: 'date' },
  kategori:        { label: 'Kategori Peserta', type: 'select', options: ['Anak', 'Dewasa', 'Guru/Pendamping', 'VIP', 'Sponsor'] },
  catatan:         { label: 'Catatan', textarea: true, ph: 'Tambahan informasi (opsional)' },
  instansi:        { label: 'Komunitas / Instansi', ph: 'mis. SMP Negeri 1 / Komunitas Sepeda' },
  jam_kedatangan:  { label: 'Jam Kedatangan (perkiraan)', type: 'time' }
};
const DEFAULT_FIELDS = {
  LEAD:      ['nama','whatsapp','email','kota','minat','jumlah_peserta','tanggal_rencana','catatan'],
  RESERVASI: ['nama','whatsapp','email','tanggal_kunjungan','jumlah_peserta','paket','minat','catatan'],
  EVENT:     ['nama','whatsapp','email','umur','sekolah','kategori','catatan']
};

let PAGE = null;

/* ---------- Load ---------- */
/* ---------- Tampilan (brand), gambar, ucapan ---------- */
function brand() {
  const b = (PAGE && PAGE.brand) || {};
  return { nama: b.nama || 'Wonderland Samarinda', tagline: b.tagline === undefined ? 'Theme Park & Recreation' : b.tagline, footer: b.footer || '', logo: b.logo || '', banner: b.banner || '' };
}
function isImgRef(u) { return /^wmc-img:IMG-\d+$/.test(String(u || '')); }
// gambar tersimpan di server: diambil terpisah supaya halaman tampil dulu; id gambar tidak berubah sehingga aman disimpan di perangkat
function loadImgRef(ref, imgEl, onFail) {
  let c = '';
  try { c = localStorage.getItem('wmcimg:' + ref) || ''; } catch (e) { c = ''; }
  if (c) { imgEl.src = c; return; }
  google.script.run.withSuccessHandler(function(r) {
    if (r && r.success && r.data && r.data.dataUrl) {
      imgEl.src = r.data.dataUrl;
      try { localStorage.setItem('wmcimg:' + ref, r.data.dataUrl); } catch (e) {}
    } else if (onFail) onFail();
  }).withFailureHandler(function() { if (onFail) onFail(); }).pubGetLandingImage(ref);
}
function hydrateImgs() {
  document.querySelectorAll('img[data-ref]').forEach(function(img) {
    loadImgRef(img.getAttribute('data-ref'), img, function() { if (img.parentNode) img.parentNode.style.display = 'none'; });
  });
}
function footHtml(withSource) {
  const b = brand();
  return '<div class="foot">' + esc(b.footer || ('© ' + b.nama)) + (withSource && PAGE.source ? ' · ' + esc(PAGE.source) : '') + '</div>';
}
// {nama} {kode} {judul} pada judul/pesan ucapan; baris baru dipertahankan
function fillTpl(t, code) {
  return String(t || '').replace(/\{nama\}/gi, String((LAST_DATA && LAST_DATA.nama) || 'Anda').trim() || 'Anda')
    .replace(/\{kode\}/gi, code || '').replace(/\{judul\}/gi, PAGE.judul || '');
}
function msgHtml(t) { return esc(t).replace(/\r?\n/g, '<br>'); }
var LAST_DATA = {};

function loadPage() {
  if (!SLUG) { showState('❓', 'Halaman tidak ditemukan', 'URL tidak valid.'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        showState('😴', 'Halaman tidak tersedia', (res && res.message) || 'Halaman tidak ditemukan.');
        return;
      }
      PAGE = res.data;
      render();
    })
    .withFailureHandler(function() { showState('⚠️', 'Terjadi kesalahan', 'Periksa koneksi internet Anda lalu muat ulang halaman ini.'); })
    .pubGetLandingPage(SLUG);
}

function showState(ic, title, msg) {
  document.getElementById('app').innerHTML =
    '<div class="state"><div class="ic">' + ic + '</div><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p>' +
    '<p style="margin-top:14px"><b>Wonderland Samarinda</b></p></div>';
}

/* ---------- Render ---------- */
// Daftar kolom: dari server (PAGE.fields: label, wajib, kolom kustom). Cadangan: bawaan lokal.
function pickFields() {
  if (PAGE.fields && PAGE.fields.length) {
    return PAGE.fields.map(function(f) {
      const d = FIELD_DEFS[f.key] || {};
      return { key: f.key, label: f.label || d.label || f.key, req: !!f.required, ph: f.placeholder || d.ph || '',
        type: f.type || d.type || 'text', options: f.options || d.options, textarea: f.type === 'textarea' || !!d.textarea };
    });
  }
  let keys = (PAGE.form_fields || []).filter(function(k) { return !!FIELD_DEFS[k]; });
  if (!keys.length) keys = DEFAULT_FIELDS[PAGE.tipe] || DEFAULT_FIELDS.LEAD;
  return keys.map(function(k) { const d = FIELD_DEFS[k]; return { key: k, label: d.label, req: !!d.req, ph: d.ph || '', type: d.type || 'text', options: d.options, textarea: !!d.textarea }; });
}
const SOC_ICON = { instagram: '📸', tiktok: '🎵', facebook: '👍', youtube: '▶️' };
function socialHtml() {
  let h = '';
  const soc = PAGE.social || [];
  if (soc.length) {
    h += '<div class="soc"><div class="soc-t">' + esc(PAGE.social_text || 'Ikuti kami') + '</div><div class="soc-row">' +
      soc.map(function(x) { return '<a class="soc-btn soc-' + esc(x.key) + '" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + (SOC_ICON[x.key] || '🔗') + ' ' + esc(x.label) + '</a>'; }).join('') + '</div></div>';
  }
  if (PAGE.review && PAGE.review.url) {
    h += '<div class="soc"><div class="soc-t">' + esc(PAGE.review.text || '') + '</div><div class="soc-row">' +
      '<a class="soc-btn soc-maps" href="' + esc(PAGE.review.url) + '" target="_blank" rel="noopener noreferrer">⭐ <b>Tulis Ulasan di Google Maps</b></a></div></div>';
  }
  return h;
}

/* ---------- Generator Reservasi (pilih item -> total & DP -> kirim ke WhatsApp admin) ---------- */
const GEN_ORDER = ['nama', 'instansi', 'whatsapp', 'tanggal_kunjungan', 'tanggal_rencana', 'jam_kedatangan', 'jumlah_peserta'];
var GEN_TEXT = '';
function isGen() { return !!(PAGE && PAGE.tipe === 'RESERVASI' && PAGE.mode_wa === 'GENERATOR' && PAGE.gen && PAGE.gen.items); }
function fmtRp(n) { return 'Rp' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function orderHtml() {
  const g = PAGE.gen;
  let h = '<div class="gen-sec"><h3>🛒 Order Detail</h3><div class="sub" style="margin-bottom:0">Atur jumlah tiket, penyewaan, dan paket yang Anda perlukan. Biarkan 0 bila tidak perlu.</div>';
  (g.groups || []).forEach(function(gr) {
    const items = g.items.filter(function(i) { return i.kategori === gr.key; });
    if (!items.length) return;
    h += '<div class="gen-grp"><div class="gen-grp-t">' + esc(gr.icon) + ' ' + esc(gr.label) + '</div>';
    items.forEach(function(i) {
      h += '<div class="gen-row" id="r_' + esc(i.id) + '"><div class="gen-nm"><b>' + esc(i.nama) + '</b><small>' + fmtRp(i.harga) + '</small></div>' +
        '<div class="gen-step"><button type="button" aria-label="Kurangi" onclick="genStep(\'' + esc(i.id) + '\',-1)">−</button>' +
        '<input type="number" inputmode="numeric" min="0" max="9999" id="q_' + esc(i.id) + '" value="0" oninput="genRecalc(true)">' +
        '<button type="button" aria-label="Tambah" onclick="genStep(\'' + esc(i.id) + '\',1)">+</button></div></div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}
function genQty(id) { const el = document.getElementById('q_' + id); const n = el ? Math.floor(Number(el.value)) : 0; return n > 0 ? Math.min(n, 9999) : 0; }
function genStep(id, d) {
  const el = document.getElementById('q_' + id);
  if (!el) return;
  el.value = Math.max(0, Math.min(9999, genQty(id) + d));
  genRecalc(true);
}
function genItems() {
  return PAGE.gen.items.map(function(i) { return { id: i.id, qty: genQty(i.id) }; }).filter(function(x) { return x.qty > 0; });
}
function genRecalc(fromUser) {
  if (!isGen()) return;
  const g = PAGE.gen;
  let total = 0, tix = 0, rows = '';
  g.items.forEach(function(i) {
    const q = genQty(i.id), r = document.getElementById('r_' + i.id);
    if (r) r.classList.toggle('on', q > 0);
    if (!q) return;
    total += q * i.harga;
    if (i.kategori === 'TIKET') tix += q;
    rows += '<div class="ln"><span>' + esc(i.nama) + ' × ' + q + '</span><span>' + fmtRp(q * i.harga) + '</span></div>';
  });
  const pax = document.getElementById('f_jumlah_peserta');
  if (fromUser && pax && !pax.dataset.touched && tix > 0) pax.value = tix;
  const dp = Math.round(total * g.dp_persen / 100);
  const box = document.getElementById('genSum');
  if (!box) return;
  box.innerHTML = total > 0
    ? rows + '<div class="tot"><span>💰 Total Biaya</span><span>' + fmtRp(total) + '</span></div>' +
      '<div class="dp"><span>💳 DP ' + esc(String(g.dp_persen).replace('.', ',')) + '%</span><span>' + fmtRp(dp) + '</span></div>'
    : '<div class="empty">Belum ada item dipilih. Total dan DP akan muncul di sini.</div>';
}
function genCopy() {
  const done = function() { toast('Teks formulir disalin.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(GEN_TEXT).then(done, function() { genCopyOld(done); }); }
  else genCopyOld(done);
}
function genCopyOld(done) {
  const t = document.createElement('textarea'); t.value = GEN_TEXT; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Gagal menyalin. Tekan tombol WhatsApp saja.', 'error'); }
  t.remove();
}

function render() {
  const app = document.getElementById('app');
  const fields = pickFields();
  let evHtml = '';
  if (PAGE.tipe === 'EVENT' && PAGE.event) {
    const e = PAGE.event;
    const kuotaTxt = e.sisa === null ? e.terisi + ' terdaftar' : e.terisi + ' / ' + e.kuota + ' · sisa ' + e.sisa;
    const pct = e.kuota > 0 ? Math.min(100, Math.round(e.terisi / e.kuota * 100)) : 0;
    evHtml =
      '<div class="ev-info">' +
        evChip('Event', e.nama) +
        evChip('Tanggal', fmtDate(e.tanggal_mulai) + (e.tanggal_selesai && e.tanggal_selesai !== e.tanggal_mulai ? ' s.d. ' + fmtDate(e.tanggal_selesai) : '')) +
        evChip('Lokasi', e.lokasi || 'Wonderland Samarinda') +
        evChip('Biaya', e.biaya ? 'Rp ' + Number(e.biaya).toLocaleString('id-ID') : 'Gratis / info lanjut') +
      '</div>' +
      '<div class="form-group"><label>Kuota Pendaftaran</label>' +
        '<div style="font-size:13px;font-weight:700">' + esc(kuotaTxt) + '</div>' +
        '<div class="kuota-bar"><span style="width:' + pct + '%"></span></div></div>';
  }
  if (PAGE.tipe === 'RESERVASI' && PAGE.biaya && !isGen()) {
    evHtml += '<div class="ev-info">' + evChip('Harga per Pax', 'Rp ' + Number(PAGE.biaya).toLocaleString('id-ID')) + '</div>';
  }

  const todayIso = new Date().toISOString().substring(0, 10);
  function fieldHtml(f) {
    const k = f.key;
    const req = f.req;
    let h = '<div class="form-group"><label>' + esc(f.label) + (req ? ' <span class="req">*</span>' : '') + '</label>';
    if (f.textarea) {
      h += '<textarea class="form-control" id="f_' + k + '" placeholder="' + esc(f.ph || '') + '"' + (req ? ' required' : '') + '></textarea>';
    } else if (f.type === 'select') {
      h += '<select class="form-control" id="f_' + k + '"><option value="">— Pilih —</option>' +
        f.options.map(function(o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
    } else {
      const isBirth = (k === 'tanggal_lahir' || (f.type === 'date' && /lahir|ultah|ulang tahun|birth/i.test(k + ' ' + (f.label || ''))));
      const minAttr = (GEN && f.type === 'date' && (k === 'tanggal_kunjungan' || k === 'tanggal_rencana')) ? ' min="' + todayIso + '"' : '';
      h += '<input class="form-control" type="' + (f.type || 'text') + '" id="f_' + k + '" placeholder="' + esc(f.ph || '') + '"' +
        (f.type === 'number' ? ' min="0" step="1"' : '') + (isBirth ? ' max="' + todayIso + '"' : '') + minAttr +
        (k === 'jumlah_peserta' && GEN ? ' oninput="this.dataset.touched=1"' : '') + (req ? ' required' : '') + '>';
    }
    return h + '</div>';
  }
  const GEN = isGen();
  let formHtml = '';
  if (GEN) {
    const head = [], tail = [];
    fields.forEach(function(f) { (GEN_ORDER.indexOf(f.key) >= 0 ? head : tail).push(f); });
    head.sort(function(a, b) { return GEN_ORDER.indexOf(a.key) - GEN_ORDER.indexOf(b.key); });
    formHtml = head.map(fieldHtml).join('') + orderHtml() + tail.map(fieldHtml).join('') + '<div class="gen-sum" id="genSum"></div>';
  } else {
    formHtml = fields.map(fieldHtml).join('');
  }

  const B = brand();
  const BANNER = PAGE.banner_url || B.banner || '';
  document.title = (PAGE.judul ? PAGE.judul + ' · ' : '') + B.nama;
  app.innerHTML =
    '<div class="hero"><div class="hero-inner">' +
      '<div class="hero-brand">' + (B.logo ? '<div class="logo-badge has-img"><img data-ref="' + esc(B.logo) + '" alt=""></div>' : '<div class="logo-badge">' + esc(String(B.nama).charAt(0).toUpperCase() || 'W') + '</div>') +
        '<div><b>' + esc(B.nama) + '</b>' + (B.tagline ? '<small>' + esc(B.tagline) + '</small>' : '') + '</div></div>' +
      '<h1>' + esc(PAGE.judul) + '</h1>' +
      (PAGE.deskripsi ? '<div class="desc">' + esc(PAGE.deskripsi) + '</div>' : '') +
      (BANNER ? '<div class="hero-banner">' + (isImgRef(BANNER) ? '<img data-ref="' + esc(BANNER) + '" alt="banner">' : '<img src="' + esc(BANNER) + '" alt="banner" referrerpolicy="no-referrer" onerror="this.parentNode.style.display=\'none\'">') + '</div>' : '') +
    '</div></div>' +
    (PAGE.penawaran ? '<div class="offer"><div class="offer-box">🎁 <b>Penawaran Spesial</b><br>' + esc(PAGE.penawaran) + '</div></div>' : '') +
    '<div class="main"><div class="card">' +
      '<h2>' + (PAGE.tipe === 'EVENT' ? '📝 Form Pendaftaran Event' : PAGE.tipe === 'RESERVASI' ? '🎫 Form Reservasi' : '✉️ Formulir') + '</h2>' +
      '<div class="sub">' + (PAGE.campaign ? 'Campaign: ' + esc(PAGE.campaign) + ' · ' : '') + 'Data Anda aman dan hanya digunakan untuk keperluan informasi &amp; reservasi.</div>' +
      evHtml +
      '<div id="formErr" class="err hidden"></div>' +
      '<form id="pubForm" onsubmit="return submitForm(event)">' + formHtml +
        '<button class="btn btn-primary" id="btnSubmit" type="submit">' + esc(ctaLabel()) + '</button>' +
      '</form>' +
      socialHtml() +
      footHtml(true) +
    '</div></div>';
  hydrateImgs();
  if (GEN) genRecalc(false);

  const first = document.querySelector('#pubForm input, #pubForm select, #pubForm textarea');
  if (first) first.focus();
}

function ctaLabel() {
  const c = PAGE.cta_label || 'Kirim';
  return isGen() && c === 'Kirim' ? '📲 Kirim Reservasi ke WhatsApp' : c;
}
function evChip(l, v) {
  return '<div class="ev-chip"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v || '—') + '</div></div>';
}
function fmtDate(d) {
  if (!d) return '—';
  const p = String(d).substring(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}
function fieldVal(k) { const el = document.getElementById('f_' + k); return el ? el.value.trim() : ''; }

/* ---------- Submit ---------- */
function submitForm(e) {
  e.preventDefault();
  const errEl = document.getElementById('formErr');
  errEl.classList.add('hidden');
  const btn = document.getElementById('btnSubmit');
  const fields = pickFields();
  const data = { utm: UTM };
  LAST_DATA = data;
  let missing = '';
  fields.forEach(function(f) {
    data[f.key] = fieldVal(f.key);
    if (f.req && !data[f.key] && !missing) missing = f.label;
  });
  if (missing) { errEl.textContent = '"' + missing + '" wajib diisi.'; errEl.classList.remove('hidden'); return false; }
  if (isGen()) {
    data.items = genItems();
    if (!data.items.length) { errEl.textContent = 'Pilih minimal satu tiket, penyewaan, atau paket pada Order Detail.'; errEl.classList.remove('hidden'); errEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  }
  if (data.whatsapp && String(data.whatsapp).replace(/\D/g, '').length < 8) {
    errEl.textContent = 'Nomor WhatsApp tidak valid.'; errEl.classList.remove('hidden'); return false;
  }
  btn.disabled = true;
  btn.textContent = 'Mengirim...';

  const done = function(res) {
    btn.disabled = false;
    btn.textContent = ctaLabel();
    if (!res || !res.success) {
      errEl.textContent = (res && res.message) || 'Terjadi kesalahan. Silakan coba lagi.';
      errEl.classList.remove('hidden');
      return;
    }
    showSuccess(res.data || {});
  };
  const fail = function() {
    btn.disabled = false;
    btn.textContent = ctaLabel();
    errEl.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi.';
    errEl.classList.remove('hidden');
  };

  if (PAGE.tipe === 'EVENT') {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubRegisterEvent(SLUG, data);
  } else if (PAGE.tipe === 'RESERVASI') {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubSubmitReservation(SLUG, data);
  } else {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubSubmitLead(SLUG, data);
  }
  return false;
}

/* ---------- Success ---------- */
function showSuccess(d) {
  const app = document.getElementById('app');
  const code = d.registration_id || d.nomor_reservasi || d.lead_id || '';
  const customTitle = PAGE.sukses_judul ? fillTpl(PAGE.sukses_judul, code) : '';
  const customMsg = PAGE.sukses_pesan ? '<p>' + msgHtml(fillTpl(PAGE.sukses_pesan, code)) + '</p>' : '';
  const nm = String((LAST_DATA && LAST_DATA.nama) || '').trim();
  if (PAGE.tipe === 'EVENT') {
    const regId = d.registration_id || '';
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(regId);
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>' + esc(customTitle || 'Pendaftaran Berhasil!') + '</h1>' +
      (customMsg || '<p>' + (d.duplicate ? 'Anda sudah terdaftar sebelumnya. Gunakan Registration ID ini saat check-in.' : 'Simpan Registration ID & QR Code ini untuk check-in di lokasi acara.') + '</p>') +
      '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">REGISTRATION ID</div>' +
      '<div class="reg-id">' + esc(regId) + '</div>' +
      '<img src="' + esc(qrUrl) + '" alt="QR Check-in" referrerpolicy="no-referrer"></div>' +
      (customMsg ? '' : '<p>Info pembayaran & detail acara akan dihubungkan via WhatsApp. Sampai jumpa di Wonderland! 🎡</p>') + socialHtml() +
      footHtml(false) + '</div>';
  } else if (PAGE.tipe === 'RESERVASI' && isGen() && d.wa_text) {
    GEN_TEXT = d.wa_text;
    const url = 'https://wa.me/' + encodeURIComponent(d.wa_admin || PAGE.gen.wa_admin) + '?text=' + encodeURIComponent(d.wa_text);
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>' + esc(customTitle || 'Reservasi Tersimpan!') + '</h1>' +
      (customMsg || '<p>Satu langkah lagi: tekan tombol hijau di bawah untuk mengirim formulir ini ke WhatsApp admin kami. Reservasi baru dianggap diterima setelah pesan terkirim.</p>') +
      '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">NOMOR RESERVASI ANDA</div>' +
      '<div class="reg-id">' + esc(d.nomor_reservasi || '-') + '</div>' +
      '<div style="margin-top:12px;font-size:14px">💰 Total <b>' + fmtRp(d.total) + '</b><br>💳 DP ' + esc(String(PAGE.gen.dp_persen).replace('.', ',')) + '% <b>' + fmtRp(d.dp) + '</b></div></div>' +
      '<a class="btn btn-wa" href="' + esc(url) + '" target="_blank" rel="noopener">📲 Kirim ke WhatsApp Admin</a>' +
      '<button type="button" class="btn btn-ghost" onclick="genCopy()">📋 Salin Teks Formulir</button>' +
      '<p style="margin-top:14px;font-size:12.5px">WhatsApp akan terbuka otomatis. Jika tidak, tekan tombol hijau di atas.</p>' + socialHtml() +
      footHtml(false) + '</div>';
    setTimeout(function() { try { window.location.href = url; } catch (e) {} }, 1600);
  } else if (PAGE.tipe === 'RESERVASI') {
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>' + esc(customTitle || 'Reservasi Diterima!') + '</h1>' +
      (customMsg || '<p>Terima kasih! Tim kami akan menghubungi Anda via WhatsApp untuk konfirmasi &amp; pembayaran.</p>') +
      '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">NOMOR RESERVASI ANDA</div>' +
      '<div class="reg-id">' + esc(d.nomor_reservasi || '-') + '</div></div>' + socialHtml() +
      footHtml(false) + '</div>';
  } else {
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>' + esc(customTitle || (nm ? 'Terima Kasih, ' + nm + '!' : 'Terima Kasih!')) + '</h1>' +
      (customMsg || '<p>' + esc('Data Anda sudah kami terima. Tim marketing kami akan menghubungi Anda via WhatsApp.') + '</p>') +
      (d.lead_id ? '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">KODE / ID ANDA (tunjukkan ke kasir)</div><div class="reg-id">' + esc(d.lead_id) + '</div></div>' : '') +
      (!customMsg && PAGE.social && PAGE.social.length ? '<p style="margin-top:12px;font-size:13px">Jangan lupa follow akun kami di bawah ini — petugas kasir akan mengecek saat Anda datang.</p>' : '') + socialHtml() +
      footHtml(false) + '</div>';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('DOMContentLoaded', loadPage);
</script>
</body>
</html>
