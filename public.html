<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" type="image/png" href="icons/favicon.png">
<script src="config.js"></script>
<script src="gas-shim.js"></script>
<title>Wonderland Samarinda</title>
<style>
:root{
  --primary:#6d28d9; --primary-dark:#4c1d95; --primary-light:#ede9fe;
  --accent:#f59e0b; --bg:#f4f5fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
  --border:#e5e7eb; --success:#10b981; --danger:#ef4444;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(76,29,149,.18);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
.hidden{display:none!important}
a{color:var(--primary)}
button{font-family:inherit;cursor:pointer}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(135deg,#2e1065 0%,#6d28d9 55%,#a855f7 100%);color:#fff;padding:0 0 46px}
.hero-inner{max-width:860px;margin:0 auto;padding:20px}
.hero-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.logo-badge{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.hero-brand b{font-size:15px;display:block;line-height:1.2}
.hero-brand small{font-size:11px;opacity:.8}
.hero h1{font-size:27px;line-height:1.25;font-weight:800;margin-bottom:10px}
.hero .desc{font-size:14.5px;opacity:.92;white-space:pre-wrap}
.hero-banner{margin-top:18px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-banner img{width:100%;display:block;max-height:320px;object-fit:cover}

/* ---------- OFFER ---------- */
.offer{max-width:860px;margin:-26px auto 0;padding:0 20px;position:relative;z-index:2}
.offer-box{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fcd34d;color:#78350f;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-lg);white-space:pre-wrap;font-size:14px}

/* ---------- FORM CARD ---------- */
.main{max-width:860px;margin:22px auto 40px;padding:0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.card h2{font-size:17px;margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ev-chip{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px}
.ev-chip .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ev-chip .v{font-size:13.5px;font-weight:700;margin-top:2px}
.kuota-bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:6px}
.kuota-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#a855f7)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
.form-control{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--text)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea.form-control{resize:vertical;min-height:80px}
.req{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:700;transition:all .15s ease;width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}

/* ---------- SUCCESS ---------- */
.success{max-width:560px;margin:40px auto;padding:0 20px;text-align:center}
.success .ic{width:74px;height:74px;border-radius:50%;background:#d1fae5;color:#059669;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 14px}
.success h1{font-size:22px;margin-bottom:8px}
.success p{color:var(--muted);font-size:14px}
.reg-box{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin:18px 0}
.reg-id{font-size:24px;font-weight:800;letter-spacing:1px;color:var(--primary-dark)}
.reg-box img{width:170px;height:170px;border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:10px}

/* ---------- STATES ---------- */
.state{max-width:460px;margin:70px auto;padding:0 20px;text-align:center}
.state .ic{font-size:46px;margin-bottom:12px}
.state h1{font-size:19px;margin-bottom:6px}
.state p{color:var(--muted);font-size:13.5px}
.spinner{width:34px;height:34px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toastRoot{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);max-width:320px}
.toast.error{background:var(--danger)}
@media(max-width:600px){.hero h1{font-size:22px}.card{padding:18px}}
</style>
</head>
<body>
<div id="toastRoot"></div>
<div id="app"><div class="state"><div class="spinner"></div><p>Memuat halaman...</p></div></div>

<script>
'use strict';

/* ---------- Helpers ---------- */
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg, type){ type=type||'success'; const r=document.getElementById('toastRoot'); const el=document.createElement('div'); el.className='toast '+(type==='error'?'error':''); el.textContent=msg; r.appendChild(el); setTimeout(function(){ el.remove(); },3600); }
function qs(name){ const m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : ''; }

const SLUG = (qs('page') || qs('slug') || '').trim();
const UTM = { source: qs('utm_source'), medium: qs('utm_medium'), campaign: qs('utm_campaign'), term: qs('utm_term'), content: qs('utm_content') };

/* Definisi kolom form yang diizinkan (whitelist) */
const FIELD_DEFS = {
  nama:            { label: 'Nama Lengkap', req: true, ph: 'Nama Anda' },
  whatsapp:        { label: 'No. WhatsApp', req: true, ph: '08xxxxxxxxxx' },
  email:           { label: 'Email', type: 'email', ph: 'email@contoh.com' },
  kota:            { label: 'Kota / Domisili', ph: 'mis. Samarinda' },
  jenis_pelanggan: { label: 'Jenis (Individu / Keluarga / Sekolah / Kantor / Komunitas)', ph: 'mis. Keluarga' },
  minat:           { label: 'Minat / Kebutuhan', textarea: true, ph: 'Ceritakan kebutuhan Anda...' },
  jumlah_peserta:  { label: 'Jumlah Peserta', type: 'number', ph: 'mis. 25' },
  tanggal_rencana: { label: 'Tanggal Rencana Kunjungan', type: 'date' },
  tanggal_kunjungan:{ label: 'Tanggal Kunjungan', type: 'date' },
  paket:           { label: 'Paket / Permintaan Khusus', ph: 'mis. Paket Sekolah' },
  umur:            { label: 'Umur', type: 'number', ph: 'mis. 10' },
  sekolah:         { label: 'Sekolah / Instansi', ph: 'mis. SDN 001' },
  kategori:        { label: 'Kategori Peserta', type: 'select', options: ['Anak', 'Dewasa', 'Guru/Pendamping', 'VIP', 'Sponsor'] },
  catatan:         { label: 'Catatan', textarea: true, ph: 'Tambahan informasi (opsional)' }
};
const DEFAULT_FIELDS = {
  LEAD:      ['nama','whatsapp','email','kota','minat','jumlah_peserta','tanggal_rencana','catatan'],
  RESERVASI: ['nama','whatsapp','email','tanggal_kunjungan','jumlah_peserta','paket','minat','catatan'],
  EVENT:     ['nama','whatsapp','email','umur','sekolah','kategori','catatan']
};

let PAGE = null;

/* ---------- Load ---------- */
function loadPage() {
  if (!SLUG) { showState('❓', 'Halaman tidak ditemukan', 'URL tidak valid.'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        showState('😴', 'Halaman tidak tersedia', (res && res.message) || 'Halaman tidak ditemukan.');
        return;
      }
      PAGE = res.data;
      render();
    })
    .withFailureHandler(function() { showState('⚠️', 'Terjadi kesalahan', 'Periksa koneksi internet Anda lalu muat ulang halaman ini.'); })
    .pubGetLandingPage(SLUG);
}

function showState(ic, title, msg) {
  document.getElementById('app').innerHTML =
    '<div class="state"><div class="ic">' + ic + '</div><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p>' +
    '<p style="margin-top:14px"><b>Wonderland Samarinda</b></p></div>';
}

/* ---------- Render ---------- */
function pickFields() {
  let keys = [];
  if (PAGE.form_fields && PAGE.form_fields.length) {
    keys = PAGE.form_fields.filter(function(k) { return !!FIELD_DEFS[k]; });
  }
  if (!keys.length) keys = DEFAULT_FIELDS[PAGE.tipe] || DEFAULT_FIELDS.LEAD;
  return keys;
}

function render() {
  const app = document.getElementById('app');
  const fields = pickFields();
  let evHtml = '';
  if (PAGE.tipe === 'EVENT' && PAGE.event) {
    const e = PAGE.event;
    const kuotaTxt = e.sisa === null ? e.terisi + ' terdaftar' : e.terisi + ' / ' + e.kuota + ' · sisa ' + e.sisa;
    const pct = e.kuota > 0 ? Math.min(100, Math.round(e.terisi / e.kuota * 100)) : 0;
    evHtml =
      '<div class="ev-info">' +
        evChip('Event', e.nama) +
        evChip('Tanggal', fmtDate(e.tanggal_mulai) + (e.tanggal_selesai && e.tanggal_selesai !== e.tanggal_mulai ? ' s.d. ' + fmtDate(e.tanggal_selesai) : '')) +
        evChip('Lokasi', e.lokasi || 'Wonderland Samarinda') +
        evChip('Biaya', e.biaya ? 'Rp ' + Number(e.biaya).toLocaleString('id-ID') : 'Gratis / info lanjut') +
      '</div>' +
      '<div class="form-group"><label>Kuota Pendaftaran</label>' +
        '<div style="font-size:13px;font-weight:700">' + esc(kuotaTxt) + '</div>' +
        '<div class="kuota-bar"><span style="width:' + pct + '%"></span></div></div>';
  }
  if (PAGE.tipe === 'RESERVASI' && PAGE.biaya) {
    evHtml += '<div class="ev-info">' + evChip('Harga per Pax', 'Rp ' + Number(PAGE.biaya).toLocaleString('id-ID')) + '</div>';
  }

  let formHtml = '';
  fields.forEach(function(k) {
    const f = FIELD_DEFS[k];
    const req = f.req || (PAGE.tipe === 'RESERVASI' && (k === 'tanggal_kunjungan' || k === 'jumlah_peserta'));
    formHtml += '<div class="form-group"><label>' + esc(f.label) + (req ? ' <span class="req">*</span>' : '') + '</label>';
    if (f.textarea) {
      formHtml += '<textarea class="form-control" id="f_' + k + '" placeholder="' + esc(f.ph || '') + '"' + (req ? ' required' : '') + '></textarea>';
    } else if (f.type === 'select') {
      formHtml += '<select class="form-control" id="f_' + k + '"><option value="">— Pilih —</option>' +
        f.options.map(function(o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
    } else {
      formHtml += '<input class="form-control" type="' + (f.type || 'text') + '" id="f_' + k + '" placeholder="' + esc(f.ph || '') + '"' +
        (f.type === 'number' ? ' min="0" step="1"' : '') + (req ? ' required' : '') + '>';
    }
    formHtml += '</div>';
  });

  app.innerHTML =
    '<div class="hero"><div class="hero-inner">' +
      '<div class="hero-brand"><div class="logo-badge">W</div><div><b>Wonderland Samarinda</b><small>Theme Park &amp; Recreation</small></div></div>' +
      '<h1>' + esc(PAGE.judul) + '</h1>' +
      (PAGE.deskripsi ? '<div class="desc">' + esc(PAGE.deskripsi) + '</div>' : '') +
      (PAGE.banner_url ? '<div class="hero-banner"><img src="' + esc(PAGE.banner_url) + '" alt="banner" referrerpolicy="no-referrer" onerror="this.parentNode.style.display=\'none\'"></div>' : '') +
    '</div></div>' +
    (PAGE.penawaran ? '<div class="offer"><div class="offer-box">🎁 <b>Penawaran Spesial</b><br>' + esc(PAGE.penawaran) + '</div></div>' : '') +
    '<div class="main"><div class="card">' +
      '<h2>' + (PAGE.tipe === 'EVENT' ? '📝 Form Pendaftaran Event' : PAGE.tipe === 'RESERVASI' ? '🎫 Form Reservasi' : '✉️ Formulir') + '</h2>' +
      '<div class="sub">' + (PAGE.campaign ? 'Campaign: ' + esc(PAGE.campaign) + ' · ' : '') + 'Data Anda aman dan hanya digunakan untuk keperluan informasi &amp; reservasi.</div>' +
      evHtml +
      '<div id="formErr" class="err hidden"></div>' +
      '<form id="pubForm" onsubmit="return submitForm(event)">' + formHtml +
        '<button class="btn btn-primary" id="btnSubmit" type="submit">' + esc(PAGE.cta_label || 'Kirim') + '</button>' +
      '</form>' +
      '<div class="foot">© Wonderland Samarinda · ' + esc(PAGE.source || '') + '</div>' +
    '</div></div>';

  const first = document.querySelector('#pubForm input, #pubForm select, #pubForm textarea');
  if (first) first.focus();
}

function evChip(l, v) {
  return '<div class="ev-chip"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v || '—') + '</div></div>';
}
function fmtDate(d) {
  if (!d) return '—';
  const p = String(d).substring(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}
function fieldVal(k) { const el = document.getElementById('f_' + k); return el ? el.value.trim() : ''; }

/* ---------- Submit ---------- */
function submitForm(e) {
  e.preventDefault();
  const errEl = document.getElementById('formErr');
  errEl.classList.add('hidden');
  const btn = document.getElementById('btnSubmit');
  const fields = pickFields();
  const data = { utm: UTM };
  let missing = '';
  fields.forEach(function(k) {
    data[k] = fieldVal(k);
    const req = FIELD_DEFS[k].req || (PAGE.tipe === 'RESERVASI' && (k === 'tanggal_kunjungan' || k === 'jumlah_peserta'));
    if (req && !data[k]) missing = FIELD_DEFS[k].label;
  });
  if (missing) { errEl.textContent = '"' + missing + '" wajib diisi.'; errEl.classList.remove('hidden'); return false; }
  if (data.whatsapp && String(data.whatsapp).replace(/\D/g, '').length < 8) {
    errEl.textContent = 'Nomor WhatsApp tidak valid.'; errEl.classList.remove('hidden'); return false;
  }
  btn.disabled = true;
  btn.textContent = 'Mengirim...';

  const done = function(res) {
    btn.disabled = false;
    btn.textContent = PAGE.cta_label || 'Kirim';
    if (!res || !res.success) {
      errEl.textContent = (res && res.message) || 'Terjadi kesalahan. Silakan coba lagi.';
      errEl.classList.remove('hidden');
      return;
    }
    showSuccess(res.data || {});
  };
  const fail = function() {
    btn.disabled = false;
    btn.textContent = PAGE.cta_label || 'Kirim';
    errEl.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi.';
    errEl.classList.remove('hidden');
  };

  if (PAGE.tipe === 'EVENT') {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubRegisterEvent(SLUG, data);
  } else if (PAGE.tipe === 'RESERVASI') {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubSubmitReservation(SLUG, data);
  } else {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).pubSubmitLead(SLUG, data);
  }
  return false;
}

/* ---------- Success ---------- */
function showSuccess(d) {
  const app = document.getElementById('app');
  if (PAGE.tipe === 'EVENT') {
    const regId = d.registration_id || '';
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(regId);
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>Pendaftaran Berhasil!</h1>' +
      '<p>' + (d.duplicate ? 'Anda sudah terdaftar sebelumnya. Gunakan Registration ID ini saat check-in.' : 'Simpan Registration ID & QR Code ini untuk check-in di lokasi acara.') + '</p>' +
      '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">REGISTRATION ID</div>' +
      '<div class="reg-id">' + esc(regId) + '</div>' +
      '<img src="' + esc(qrUrl) + '" alt="QR Check-in" referrerpolicy="no-referrer"></div>' +
      '<p>Info pembayaran & detail acara akan dihubungkan via WhatsApp. Sampai jumpa di Wonderland! 🎡</p>' +
      '<div class="foot">© Wonderland Samarinda</div></div>';
  } else if (PAGE.tipe === 'RESERVASI') {
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>Reservasi Diterima!</h1>' +
      '<p>Terima kasih! Tim kami akan menghubungi Anda via WhatsApp untuk konfirmasi &amp; pembayaran.</p>' +
      '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">NOMOR RESERVASI ANDA</div>' +
      '<div class="reg-id">' + esc(d.nomor_reservasi || '-') + '</div></div>' +
      '<div class="foot">© Wonderland Samarinda</div></div>';
  } else {
    app.innerHTML =
      '<div class="success"><div class="ic">🎉</div><h1>Terima Kasih, ' + esc((PAGE && 'Data Anda') || 'Data Anda') + '!</h1>' +
      '<p>' + esc('Data Anda sudah kami terima. Tim marketing kami akan menghubungi Anda via WhatsApp.') + '</p>' +
      (d.lead_id ? '<div class="reg-box"><div style="font-size:12px;color:var(--muted)">ID LEAD ANDA</div><div class="reg-id">' + esc(d.lead_id) + '</div></div>' : '') +
      '<div class="foot">© Wonderland Samarinda</div></div>';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('DOMContentLoaded', loadPage);
</script>
</body>
</html>
